<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Transformer & LLM 发展时间轴 (2017-2026)</title>
<style>
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #ffffff;
    color: #222;
    margin: 0;
    padding: 16px;
  }
  h1 { text-align: center; font-weight: 300; letter-spacing: 2px; color: #1a1a1a; margin: 0 0 6px; font-size: 26px; }
  .sub { text-align: center; color: #666; margin-bottom: 14px; font-size: 15px; }
  .chart-wrap {
    max-width: 900px;
    margin: 0 auto;
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 16px 20px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  }
  svg { width: 100%; height: auto; display: block; }
  .grid line { stroke: #e5e7eb; stroke-dasharray: 3,3; }
  .axis text { fill: #444; font-size: 16px; }
  .axis-label { fill: #222; font-size: 18px; font-weight: 700; }
  .panel-title { fill: #111; font-size: 20px; font-weight: 700; }
  .line-params { fill: none; stroke: #e11d74; stroke-width: 3; }
  .line-ctx    { fill: none; stroke: #0d9488; stroke-width: 3; stroke-dasharray: 6,3; }
  .dot-params  { fill: #e11d74; stroke: #ffffff; stroke-width: 2; }
  .dot-ctx     { fill: #0d9488; stroke: #ffffff; stroke-width: 2; }
  .label {
    fill: #222; font-size: 12.5px; font-weight: 500; pointer-events: none;
  }
  .label-era {
    fill: #b45309; font-size: 14px; font-weight: 500;
  }
  .era-band { fill: #f59e0b; opacity: 0.06; }
  .era-line { stroke: #b45309; stroke-width: 1; stroke-dasharray: 2,4; opacity: 0.35; }
  .legend { display: flex; justify-content: center; gap: 32px; margin-top: 12px; font-size: 16px; color: #222; }
  .legend-item { display: flex; align-items: center; gap: 8px; }
  .swatch { width: 24px; height: 3px; }
  .tooltip {
    position: absolute; background: #ffffff; border: 1px solid #0d9488;
    padding: 8px 12px; border-radius: 6px; font-size: 13px; color: #222;
    pointer-events: none; opacity: 0; transition: opacity 0.15s;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15); max-width: 280px;
  }
  .tooltip b { color: #0d9488; }
  circle.hit { cursor: pointer; }
  circle.hit:hover { r: 8; }
  .footnote { text-align: center; color: #888; font-size: 12px; margin-top: 16px; }
  .guide { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 2,3; opacity: 0.7; }
</style>
</head>
<body>
<h1>Transformer &amp; LLM 发展时间轴</h1>
<div class="sub">参数量 & 上下文窗口长度 · 2017 — 2026（两图共享时间轴）</div>

<div class="chart-wrap">
  <svg id="chart" viewBox="0 0 880 590" preserveAspectRatio="xMidYMid meet"></svg>
  <div class="legend">
    <div class="legend-item"><div class="swatch" style="background:#e11d74"></div>参数量</div>
    <div class="legend-item"><div class="swatch" style="background:#0d9488;background-image:linear-gradient(90deg,#0d9488 60%,transparent 60%);background-size:9px 3px;"></div>上下文长度</div>
    <div class="legend-item"><div class="swatch" style="background:#b45309;height:1px;border-top:1px dashed #b45309;"></div>发展阶段</div>
  </div>
  <div class="footnote">仅保留关键里程碑 · 上下两图共用 X 轴（年份） · 纵轴均为对数刻度 · 悬停查看详情</div>
</div>

<div id="tt" class="tooltip"></div>

<script>
// ============ DATA ============
const models = [
  { d: 2017.50, name: "Transformer",  params: 65,      ctx: 512,     note: "《Attention Is All You Need》<br>自注意力机制奠基" },
  { d: 2018.83, name: "BERT",         params: 340,     ctx: 512,     note: "双向 Encoder，刷新 11 项 NLP SOTA" },
  { d: 2019.17, name: "GPT-2",        params: 1500,    ctx: 1024,    note: "零样本能力显现" },
  { d: 2020.42, name: "GPT-3",        params: 175000,  ctx: 2048,    note: "上下文学习，涌现能力" },
  { d: 2022.08, name: "InstructGPT",  params: 175000,  ctx: 2048,    note: "RLHF 路线代表作，对齐训练范式成形" },
  { d: 2022.33, name: "PaLM",         params: 540000,  ctx: 2048,    note: "稠密模型规模巅峰" },
  { d: 2022.92, name: "ChatGPT",      params: 175000,  ctx: 4096,    note: "人类反馈强化学习出圈，消费级 LLM" },
  { d: 2023.17, name: "GPT-3.5",      params: null,    ctx: 4096,    note: "指令跟随与对话能力产品化成熟" },
  { d: 2023.25, name: "GPT-4",        params: 1800000, ctx: 8192,    note: "多模态 + 稀疏混合专家（推测）" },
  { d: 2023.25, name: "Claude 1",     params: null,    ctx: 100000,  note: "长上下文首次突破 10 万" },
  { d: 2023.58, name: "Claude 2",     params: null,    ctx: 100000,  note: "对齐能力延续，并推动长上下文实用化" },
  { d: 2024.17, name: "Gemini 1.5",   params: null,    ctx: 1000000, note: "百万级上下文革命" },
  { d: 2024.58, name: "Llama 3.1",    params: 405000,  ctx: 128000,  note: "开源 4050 亿参数 + 12.8 万上下文" },
  { d: 2024.75, name: "o1",           params: null,    ctx: 128000,  note: "推理时计算，深度思考" },
  { d: 2025.05, name: "DeepSeek-R1",  params: 671000,  ctx: 128000,  note: "671B / 37B 激活，强化学习驱动的推理模型" },
  { d: 2025.23, name: "Gemini 2.5 Pro", params: null,  ctx: 1000000, note: "强化推理能力，面向复杂任务与智能体工作流" },
  { d: 2025.39, name: "Claude 4",     params: null,    ctx: 200000,  note: "面向高级推理、编码与长程 Agent 工作流" },
  { d: 2026.27, name: "GLM-5.1",      params: 744000,  ctx: 200000,  note: "744B 参数，面向长程 Agent 工程任务" },
];

const eras = [
  { x0: 2017, x1: 2020,    label: "① 架构提出与预训练形成" },
  { x0: 2020, x1: 2022.0,  label: "② 参数扩展与涌现研究" },
  { x0: 2022.0, x1: 2024.75,  label: "③ 后训练对齐与上下文拓展" },
  { x0: 2024.75, x1: 2026.6,  label: "④ 推理增强与智能体探索" },
];

// ============ LAYOUT (two stacked panels sharing X) ============
const W = 860;
const padL = 78, padR = 50;
const iw = W - padL - padR;
const x0 = 2017, x1 = 2026.6;

// Panel rects (compact)
const P1 = { top: 40,  bottom: 270 };  // params
const P2 = { top: 325, bottom: 555 };  // context
const H = 590;
const ih1 = P1.bottom - P1.top;
const ih2 = P2.bottom - P2.top;

const pMin = 10, pMax = 10_000_000;     // M
const cMin = 256, cMax = 16_000_000;    // tokens

const sx  = t => padL + (t - x0) / (x1 - x0) * iw;
const syP = p => P1.bottom - (Math.log10(p) - Math.log10(pMin)) / (Math.log10(pMax) - Math.log10(pMin)) * ih1;
const syC = c => P2.bottom - (Math.log10(c) - Math.log10(cMin)) / (Math.log10(cMax) - Math.log10(cMin)) * ih2;

const fmtP = p => p >= 1e6 ? Math.round(p/1e6)+'T' :
                   p >= 1000 ? Math.round(p/1000)+'B' : Math.round(p)+'M';
const fmtC = c => c >= 1048576 ? Math.round(c/1048576)+'M' :
                   c >= 1024    ? Math.round(c/1024)+'K' : c+'';

const svg = document.getElementById('chart');
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs={}, parent=svg) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
};

// ============ ERA BANDS (span both panels) ============
eras.forEach((e, i) => {
  const x = sx(e.x0), w = sx(e.x1) - sx(e.x0);
  const eraDx = [-12, -6, 6, 12][i] || 0;
  if (i % 2 === 0) {
    el('rect', { class: 'era-band', x, y: P1.top, width: w, height: ih1 });
    el('rect', { class: 'era-band', x, y: P2.top, width: w, height: ih2 });
  }
  el('line', { class: 'era-line', x1: sx(e.x1), y1: P1.top, x2: sx(e.x1), y2: P1.bottom });
  el('line', { class: 'era-line', x1: sx(e.x1), y1: P2.top, x2: sx(e.x1), y2: P2.bottom });
  el('text', {
    class: 'label-era',
    x: x + w/2 + eraDx,
    y: P1.top - 18,
    'text-anchor': 'middle'
  }).textContent = e.label;
});

// ============ SHARED YEAR GRID (drawn in both panels) ============
const grid = el('g', { class: 'grid' });
for (let y = 2017; y <= 2026; y++) {
  el('line', { x1: sx(y), y1: P1.top, x2: sx(y), y2: P1.bottom }, grid);
  el('line', { x1: sx(y), y1: P2.top, x2: sx(y), y2: P2.bottom }, grid);
  // year labels at bottom of each panel
  el('text', { class: 'axis', x: sx(y), y: P1.bottom + 24, 'text-anchor': 'middle', fill: '#555' }).textContent = y;
  el('text', { class: 'axis', x: sx(y), y: P2.bottom + 24, 'text-anchor': 'middle', fill: '#555' }).textContent = y;
}

// ============ PANEL 1: PARAMETERS ============
// Y axis ticks (log)
for (let e = 1; e <= 7; e++) {
  const v = Math.pow(10, e);
  const y = syP(v);
  el('line', { x1: padL, y1: y, x2: padL + iw, y2: y }, grid);
  el('text', { class: 'axis', x: padL - 12, y: y + 5, 'text-anchor': 'end', fill: '#e11d74' }).textContent = fmtP(v);
}
el('text', { class: 'axis-label', x: padL - 62, y: (P1.top + P1.bottom)/2, transform: `rotate(-90, ${padL - 62}, ${(P1.top + P1.bottom)/2})`, 'text-anchor': 'middle', fill: '#e11d74' }).textContent = '参数量';
// axis border
el('line', { x1: padL, y1: P1.top, x2: padL, y2: P1.bottom, stroke: '#111', 'stroke-width': 1 });
el('line', { x1: padL, y1: P1.bottom, x2: padL + iw, y2: P1.bottom, stroke: '#111', 'stroke-width': 1 });

// ============ PANEL 2: CONTEXT ============
[512, 2048, 8192, 32768, 131072, 1048576, 10485760].forEach(v => {
  const y = syC(v);
  el('line', { x1: padL, y1: y, x2: padL + iw, y2: y }, grid);
  el('text', { class: 'axis', x: padL - 12, y: y + 5, 'text-anchor': 'end', fill: '#0d9488' }).textContent = fmtC(v);
});
el('text', { class: 'axis-label', x: padL - 62, y: (P2.top + P2.bottom)/2, transform: `rotate(-90, ${padL - 62}, ${(P2.top + P2.bottom)/2})`, 'text-anchor': 'middle', fill: '#0d9488' }).textContent = '上下文长度';
el('line', { x1: padL, y1: P2.top, x2: padL, y2: P2.bottom, stroke: '#111', 'stroke-width': 1 });
el('line', { x1: padL, y1: P2.bottom, x2: padL + iw, y2: P2.bottom, stroke: '#111', 'stroke-width': 1 });

// ============ FRONTIER LINES ============
function frontier(pts, key) {
  let best = -Infinity, out = [];
  for (const p of pts) {
    if (p[key] == null) continue;
    if (p[key] > best) { best = p[key]; out.push(p); }
  }
  return out;
}
const pSorted = [...models].sort((a,b)=>a.d-b.d);
const paramsFront = frontier(pSorted, 'params');
const ctxFront    = frontier(pSorted, 'ctx');
const claude1 = models.find(m => m.name === 'Claude 1');
const claude2 = models.find(m => m.name === 'Claude 2');
const gemini15 = models.find(m => m.name === 'Gemini 1.5');
const ctxFrontWithClaude2 = ctxFront.flatMap(point => {
  if (point.name === 'Claude 1' && claude2) return [point, claude2];
  if (point.name === 'Gemini 1.5' && claude1 && claude2) return [];
  return [point];
});
if (gemini15) ctxFrontWithClaude2.push(gemini15);

el('path', { class: 'line-params',
  d: paramsFront.map((p,i)=>`${i?'L':'M'}${sx(p.d)},${syP(p.params)}`).join(' ') });
el('path', { class: 'line-ctx',
  d: ctxFrontWithClaude2.map((p,i)=>`${i?'L':'M'}${sx(p.d)},${syC(p.ctx)}`).join(' ') });

// ============ DOTS + TOOLTIP (same model on both panels where applicable) ============
const tt = document.getElementById('tt');
function bindTip(circle, html) {
  circle.addEventListener('mousemove', ev => {
    tt.innerHTML = html;
    tt.style.left = (ev.pageX + 14) + 'px';
    tt.style.top  = (ev.pageY + 14) + 'px';
    tt.style.opacity = 1;
  });
  circle.addEventListener('mouseleave', () => tt.style.opacity = 0);
}

models.forEach(m => {
  const yr = Math.floor(m.d), mo = Math.round((m.d - yr) * 12) + 1;
  const tip = `<b>${m.name}</b> · ${yr}.${String(mo).padStart(2,'0')}<br>` +
              (m.params ? `参数量: <b>${fmtP(m.params)}</b><br>` : '参数量: <i>未公开</i><br>') +
              `上下文: <b>${fmtC(m.ctx)}</b> tokens<br>` +
              `<span style="color:#666">${m.note}</span>`;
  if (m.params !== null) {
    bindTip(el('circle', { class: 'dot-params hit', cx: sx(m.d), cy: syP(m.params), r: 5 }), tip);
  }
  bindTip(el('circle', { class: 'dot-ctx hit', cx: sx(m.d), cy: syC(m.ctx), r: 5 }), tip);
});

// ============ LABELS (clean near-point placement) ============
const paramsLabels = {
  "Transformer": { dx: 0, dy: -10, anchor: 'middle' },
  "BERT":        { dx: 10, dy: 16, anchor: 'start' },
  "GPT-2":       { dx: 0, dy: -10, anchor: 'middle' },
  "GPT-3":       { dx: 10, dy: -10, anchor: 'start' },
  "InstructGPT": { dx: 4, dy: 28, anchor: 'end' },
  "PaLM":        { dx: 0, dy: -10, anchor: 'middle' },
  "ChatGPT":     { dx: 10, dy: 16, anchor: 'start' },
  "GPT-3.5":     { dx: -10, dy: 18, anchor: 'end' },
  "GPT-4":       { dx: 10, dy: -10, anchor: 'start' },
  "Llama 3.1":   { dx: 2, dy: 18, anchor: 'end' },
  "DeepSeek-R1": { dx: 0, dy: -10, anchor: 'middle' },
  "GLM-5.1":      { dx: 10, dy: 18, anchor: 'start' },
};

const ctxLabels = {
  "Transformer": { dx: 0, dy: -10, anchor: 'middle' },
  "BERT":        { dx: 10, dy: 8, anchor: 'start' },
  "GPT-2":       { dx: 10, dy: -10, anchor: 'start' },
  "GPT-3":       { dx: 10, dy: -10, anchor: 'start' },
  "InstructGPT": { dx: 4, dy: 28, anchor: 'end' },
  "PaLM":        { dx: 10, dy: 16, anchor: 'start' },
  "ChatGPT":     { dx: 10, dy: 16, anchor: 'start' },
  "GPT-3.5":     { dx: -10, dy: -10, anchor: 'end' },
  "GPT-4":       { dx: 10, dy: 16, anchor: 'start' },
  "Claude 1":    { dx: -10, dy: -10, anchor: 'end' },
  "Claude 2":    { dx: 10, dy: 18, anchor: 'start' },
  "Gemini 1.5":  { dx: -10, dy: -10, anchor: 'end' },
  "Llama 3.1":   { dx: 2, dy: -10, anchor: 'end' },
  "o1":          { dx: 0, dy: -10, anchor: 'middle' },
  "DeepSeek-R1": { dx: 60, dy: 15, anchor: 'end' },
  "Gemini 2.5 Pro": { dx: 0, dy: -10, anchor: 'middle' },
  "Claude 4":    { dx: 0, dy: -10, anchor: 'middle' },
  "GLM-5.1":      { dx: 10, dy: 18, anchor: 'start' },
};

function renderLabels(items, valueKey, yFn, color, config) {
  items.forEach(item => {
    if (item[valueKey] === null || !config[item.name]) return;
    const o = config[item.name];
    el('text', {
      class: 'label',
      x: sx(item.d) + o.dx,
      y: yFn(item[valueKey]) + o.dy,
      'text-anchor': o.anchor,
      fill: color,
    }).textContent = item.name;
  });
}

renderLabels(models, 'params', syP, '#be185d', paramsLabels);
renderLabels(models, 'ctx', syC, '#0f766e', ctxLabels);
</script>
</body>
</html>
